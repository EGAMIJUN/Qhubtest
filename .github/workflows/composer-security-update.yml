# One-off: refresh composer.lock on GitHub's runner (which can reach Packagist),
# commit it back to this branch, and print `composer audit`. Remove after use.
name: composer-security-update

on:
  push:
    branches: [chore/composer-security-update]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: mbstring, xml, curl, zip, intl, bcmath, pdo_sqlite, fileinfo
      - name: Show current audit
        run: composer audit --no-interaction || true
      - name: Update vulnerable packages
        run: |
          composer update \
            laravel/framework 'symfony/*' 'league/*' 'guzzlehttp/*' \
            phpseclib/phpseclib phpunit/phpunit psy/psysh firebase/php-jwt \
            --with-all-dependencies --no-interaction --no-scripts --no-progress
      - name: Audit after update
        run: composer audit --no-interaction || true
      - name: Commit lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock composer.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "chore(deps): composer update to patch Dependabot alerts (laravel/framework, symfony, league, guzzle, phpseclib, phpunit)"
          git push
